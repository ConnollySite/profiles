<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E2340">
<title>Profiles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/signature_pad/4.1.5/signature_pad.umd.min.js"></script>
<style>
  :root{--navy:#0E2340;--navy-2:#16345E;--blue:#0099D8;--blue-deep:#0077AD;--bg:#EEF2F6;--card:#fff;--ink:#16233A;--sub:#5B6B84;--line:#DDE4EC;--amber:#C77D00;--amber-bg:#FFF4E2;--red:#C4341F;--red-bg:#FCEBE8;--ok:#1F8A4C;--ok-bg:#E8F5EC;--radius:14px;--shadow:0 1px 2px rgba(14,35,64,.04),0 8px 24px rgba(14,35,64,.06);}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:radial-gradient(1200px 500px at 100% -10%,rgba(0,153,216,.10),transparent 60%),var(--bg);color:var(--ink);font-family:'Manrope',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-tap-highlight-color:transparent;padding-bottom:calc(84px + env(safe-area-inset-bottom));}
  .hidden{display:none !important;}
  .wrap{max-width:640px;margin:0 auto;padding:0 16px;}
  header{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);padding:calc(14px + env(safe-area-inset-top)) 0 16px;position:relative;overflow:hidden;}
  header::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(0,153,216,.35),transparent 65%);}
  .brand{display:flex;align-items:center;gap:12px;position:relative;z-index:1;}
  .brand-mark{flex:none;height:34px;width:auto;display:block;}
  .brand .who{margin-left:auto;color:#B9CBE0;font-size:12px;text-align:right;line-height:1.3;}
  .brand .who b{color:#fff;display:block;font-size:13px;}
  .doc-title{position:relative;z-index:1;margin-top:12px;color:#fff;display:flex;align-items:center;gap:10px;}
  .doc-title h1{font-size:19px;margin:0;font-weight:800;}
  .doc-title p{margin:3px 0 0;font-size:12px;color:#B9CBE0;}
  .backbtn{background:rgba(255,255,255,.14);color:#fff;border:none;border-radius:10px;padding:9px 13px;font:inherit;font-weight:800;font-size:14px;cursor:pointer;}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-top:14px;border:1px solid var(--line);}
  .card h2{font-size:11.5px;text-transform:uppercase;letter-spacing:1.3px;color:var(--blue-deep);font-weight:800;margin:0 0 12px;}
  label{display:block;font-size:13px;font-weight:700;margin:0 0 6px;}
  .hint{font-weight:500;color:var(--sub);font-size:11.5px;margin-left:4px;}
  .field{margin-bottom:15px;}
  select,input[type=text],input[type=date],input[type=time],input[type=password],input[type=number],input[type=search],textarea{width:100%;font-family:inherit;font-size:15.5px;color:var(--ink);background:#F8FAFC;border:1.5px solid var(--line);border-radius:10px;padding:12px;appearance:none;-webkit-appearance:none;}
  select:focus,input:focus,textarea:focus{outline:none;border-color:var(--blue);background:#fff;}
  textarea{resize:vertical;min-height:84px;line-height:1.4;}
  select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1l6 6 6-6' stroke='%235B6B84' stroke-width='1.8' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:34px;}
  .btn{display:block;width:100%;border:none;border-radius:12px;padding:14px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;background:linear-gradient(135deg,var(--blue),var(--blue-deep));color:#fff;box-shadow:0 6px 16px rgba(0,119,173,.28);}
  .btn:active{transform:translateY(1px);}
  .btn[disabled]{opacity:.5;box-shadow:none;}
  .btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none;}
  .btn.danger{background:var(--red);box-shadow:none;}
  .btn.small{display:inline-block;width:auto;padding:9px 14px;font-size:13px;}
  .row{display:flex;gap:10px;align-items:center;}
  .row>*{flex:1;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .chip{display:inline-block;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;margin:0 4px 4px 0;background:#EEF2F6;color:var(--sub);}
  .chip.ok{background:var(--ok-bg);color:var(--ok);} .chip.warn{background:var(--amber-bg);color:var(--amber);} .chip.bad{background:var(--red-bg);color:var(--red);} .chip.blue{background:#E1F3FB;color:var(--blue-deep);}
  .item{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;font:inherit;color:inherit;cursor:pointer;}
  .item:active{background:#F8FAFC;}
  .item .nm{font-weight:800;font-size:15px;}
  .item .sb{font-size:12px;color:var(--sub);margin-top:2px;}
  .empty{color:var(--sub);font-size:13px;padding:14px 4px;text-align:center;}
  .seg{display:flex;gap:8px;flex-wrap:wrap;}
  .seg label{margin:0;flex:1;min-width:110px;}
  .seg input{display:none;}
  .seg span{display:block;text-align:center;padding:11px 8px;border:1.5px solid var(--line);border-radius:10px;font-weight:700;font-size:13.5px;background:#F8FAFC;cursor:pointer;}
  .seg input:checked+span{background:var(--navy);color:#fff;border-color:var(--navy);}
  .rate{display:grid;grid-template-columns:1fr;gap:6px;margin-bottom:12px;}
  .rate .rn{font-weight:700;font-size:13px;}
  .stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;background:#F8FAFC;overflow:hidden;width:max-content;}
  .stepper button{width:42px;height:44px;border:none;background:transparent;font-size:19px;color:var(--navy);font-weight:700;cursor:pointer;}
  .stepper input{width:48px;text-align:center;border:none;background:transparent;font-size:16px;font-weight:800;padding:0;}
  .stat{display:flex;gap:8px;margin-top:12px;}
  .stat div{flex:1;background:#F8FAFC;border:1px solid var(--line);border-radius:10px;padding:9px 6px;text-align:center;}
  .stat b{display:block;font-size:20px;}
  .stat span{font-size:10.5px;text-transform:uppercase;font-weight:800;color:var(--sub);letter-spacing:.5px;}
  .hintbox{margin-top:12px;padding:11px 12px;border-radius:10px;background:var(--amber-bg);border:1px solid #F0D6A8;color:#7A5200;font-size:12.5px;line-height:1.45;}
  .tl{border-left:3px solid var(--line);margin:6px 0 0 6px;padding-left:12px;}
  .tl .item{margin-top:8px;}
  .sig-shell{border:1.5px solid var(--line);border-radius:10px;background:#F8FAFC;position:relative;touch-action:none;}
  .sig-shell canvas{display:block;width:100%;height:170px;border-radius:10px;}
  .sig-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:13px;pointer-events:none;}
  .tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:40;}
  .tabs button{flex:1;border:none;background:none;font:inherit;font-weight:800;font-size:11.5px;color:var(--sub);padding:8px 2px;border-radius:10px;cursor:pointer;}
  .tabs button.on{color:var(--blue-deep);background:#E1F3FB;}
  .actionbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:50;}
  .overlay{position:fixed;inset:0;background:rgba(14,35,64,.55);display:none;align-items:flex-end;justify-content:center;z-index:100;}
  .overlay.show{display:flex;}
  .sheet{background:#fff;width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));}
  .sheet h3{margin:0 0 4px;font-size:17px;} .sheet p{margin:0 0 14px;color:var(--sub);font-size:13px;}
  .sheet .btn{margin-bottom:10px;}
  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:11px 18px;border-radius:999px;font-size:13px;font-weight:700;z-index:120;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .kv{font-size:14px;margin:0 0 10px;line-height:1.45;} .kv b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--sub);}
  .kv .v{white-space:pre-wrap;word-break:break-word;}
  .sync{font-size:11.5px;color:var(--sub);text-align:center;margin-top:12px;}
  .loginbox{max-width:420px;margin:30px auto 0;}
  .err{color:var(--red);font-size:13px;font-weight:700;margin-top:10px;min-height:18px;}
</style>
</head>

const CATS = ['Attendance', 'Punctuality', 'Safety', 'Conduct', 'Performance', 'Other'];
const RATE = ['Satisfactory', 'Needs improvement', 'Unsatisfactory'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsGet = (k, fb) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch (e) { return fb; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} };
const pad = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const nowTime = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const uid = () => 'P' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const normName = n => String(n || '').toLowerCase().replace(/[^a-z0-9]/g, '');
function fmtDate(s) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? (m[3] + ' ' + MONTHS[+m[2] - 1] + ' ' + m[1]) : (s || ''); }
function shortDate(s) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? (m[3] + '/' + m[2] + '/' + m[1].slice(2)) : (s || ''); }
function addMonths(s, n) { const d = new Date(s + 'T12:00:00'); d.setMonth(d.getMonth() + n); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function daysBetween(a, b) { return Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000); }
let toastTimer = null;
function toast(msg, ms) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms || 2400); }

const TYPE_ORDER = ['NOTE', 'COUNSELING', 'VERBAL', 'WRITTEN', 'ACCIDENT', 'PROBATION'];
const TYPE_CHIP = { NOTE: 'blue', COUNSELING: 'blue', VERBAL: 'warn', WRITTEN: 'bad', ACCIDENT: 'bad', PROBATION: 'ok' };

/* ================= State and storage ================= */
let S = { url: lsGet(LS_URL, ''), cred: lsGet(LS_CRED, null), users: DEFAULT_USERS.slice(), employees: [], entries: [], syncedAt: '', busy: false };
let stack = [];            // navigation: [{view, p}]
let tab = 'people';
let filters = { q: '', type: 'all', act: 'all' };

const cacheKey = () => LS_CACHE;
function loadCache() { const c = lsGet(cacheKey(), null); if (c) { S.employees = c.employees || []; S.entries = c.entries || []; S.users = c.users || S.users; S.syncedAt = c.syncedAt || ''; } }
function saveCache() { lsSet(cacheKey(), { employees: S.employees, entries: S.entries.filter(e => !e.pending), users: S.users, syncedAt: S.syncedAt }); }
const outbox = () => lsGet(LS_OUTBOX, []);

/* ================= Network ================= */
const AUTH_ERRORS = /^(Incorrect PIN|Unknown supervisor|No PIN set|Too many wrong PINs)/;
async function api(action, payload) {
  if (!S.url) throw new Error('No backend URL');
  const body = Object.assign({ user: S.cred && S.cred.user, pin: S.cred && S.cred.pin, action: action }, payload || {});
  const res = await fetch(S.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  const j = await res.json();
  if (j && j.error && AUTH_ERRORS.test(j.error) && action !== 'login') { logout(j.error); throw new Error(j.error); }
  return j;
}

function pendingEntries() {
  return outbox().map(o => Object.assign({}, o.entry, { pending: true, author: S.cred ? S.cred.user : '' }));
}
function mergeEntries(server) {
  const pend = pendingEntries();
  const ids = new Set(pend.map(p => p.id));
  return server.filter(e => !ids.has(e.id)).concat(pend);
}

let flushing = false;
async function flushOutbox() {
  if (flushing) return;
  flushing = true;
  try {
    for (;;) {
      const q = outbox();
      if (!q.length) break;
      const it = q[0];
      let r;
      try { r = await api('saveEntry', { entry: it.entry, sig: it.sig || '' }); } catch (e) { break; }
      if (r && r.ok) { lsSet(LS_OUTBOX, outbox().slice(1)); }
      else if (r && r.error) { toast('Could not save one entry: ' + r.error, 4000); lsSet(LS_OUTBOX, outbox().slice(1)); }
      else break;
    }
  } finally { flushing = false; }
}

async function refresh(quiet) {
  if (!S.cred || !S.url) return;
  await flushOutbox();
  try {
    const r = await api('list');
    if (r && r.ok) {
      S.employees = r.employees; S.users = r.users || S.users; S.syncedAt = r.serverTime || '';
      S.serverEntries = r.entries;
      S.entries = mergeEntries(r.entries);
      saveCache();
      render();
      if (!quiet) toast('Up to date');
    } else if (r && r.error && !quiet) toast(r.error);
  } catch (e) { if (!quiet) toast('Offline — showing the last saved data'); }
  updateSyncLabel();
}
function updateSyncLabel() {
  const n = outbox().length;
  $('whoSync').textContent = n ? (n + ' waiting to upload') : (S.syncedAt ? ('synced ' + S.syncedAt.slice(11, 16)) : '');
}

function logout(msg) {
  lsDel(LS_CRED); S.cred = null; stack = [];
  render();
  if (msg) { const e = $('loginErr'); if (e) e.textContent = msg; }
}

/* ================= Data helpers ================= */
const empById = id => S.employees.find(e => e.id === id);
const entriesFor = id => S.entries.filter(e => e.employeeIds.indexOf(id) >= 0).sort(cmpEntryDesc);
function cmpEntryDesc(a, b) { return ((b.date || '') + (b.time || '') + (b.created || '')).localeCompare((a.date || '') + (a.time || '') + (a.created || '')); }
function counts(id) {
  const c = { COUNSELING: 0, VERBAL: 0, WRITTEN: 0, y: { COUNSELING: 0, VERBAL: 0, WRITTEN: 0 } };
  const cut = addMonths(todayStr(), -12);
  entriesFor(id).forEach(e => { if (c[e.type] != null && e.type !== 'y') { c[e.type]++; if ((e.date || '') >= cut) c.y[e.type]++; } });
  return c;
}
function escalationHint(c) {
  if (c.WRITTEN >= 1) return 'There ' + (c.WRITTEN === 1 ? 'is 1 written warning' : 'are ' + c.WRITTEN + ' written warnings') + ' on file. Any further step (final written warning or beyond) should follow the company procedure.';
  if (c.VERBAL >= 3) return c.VERBAL + ' verbal warnings are on file — the next step is a written warning.';
  if (c.VERBAL === 2) return '2 verbal warnings on file. A third verbal warning leads to a written warning.';
  if (c.COUNSELING >= 3 && c.VERBAL === 0) return c.COUNSELING + ' informal counselings on file and no verbal warning yet. Consider a verbal warning if the issue continues.';
  return '';
}
function isOnProbation(e) { return e.status !== 'left' && (e.probStatus === 'in_progress' || e.probStatus === 'extended'); }
function probChip(e) {
  if (e.probStatus === 'approved') return '<span class="chip ok">Probation passed</span>';
  if (e.probStatus === 'failed') return '<span class="chip bad">Probation not approved</span>';
  if (isOnProbation(e)) {
    let t = e.probStatus === 'extended' ? 'Probation extended' : 'On probation';
    let cls = 'warn';
    if (e.probEnd) { const d = daysBetween(todayStr(), e.probEnd); t += d < 0 ? ' · ' + (-d) + 'd overdue' : ' · ' + d + 'd left'; if (d <= 14) cls = 'bad'; }
    return '<span class="chip ' + cls + '">' + esc(t) + '</span>';
  }
  return '';
}
function entrySummary(e) {
  const d = e.data || {};
  return e.text || d.concern || d.description || d.comments || '';
}
function entryTitle(e) {
  const f = FORMS[e.type]; let t = f ? f.label : e.type;
  if (e.type === 'NOTE') t = (e.data && e.data.kind === 'positive' ? '★ Positive' : '⚠ Fault') + (e.category ? ' · ' + e.category : '');
  if (e.type === 'WRITTEN' && e.data && e.data.level) t = e.data.level;
  if (e.type === 'PROBATION' && e.data && e.data.review) t = 'Probation · ' + e.data.review;
  return t;
}

/* ================= Router ================= */
function go(view, p) { stack.push({ view: view, p: p || {} }); render(); window.scrollTo(0, 0); }
function back() { if (stack.length) stack.pop(); render(); window.scrollTo(0, 0); }
function setHeader(title, sub, canBack) {
  $('pageTitle').textContent = title; $('pageSub').textContent = sub || '';
  $('backBtn').classList.toggle('hidden', !canBack);
}
$('backBtn').addEventListener('click', back);
$('tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  tab = b.getAttribute('data-tab'); stack = []; render(); window.scrollTo(0, 0);
});

function render() {
  const app = $('app');
  const authed = !!(S.cred && S.url);
  $('tabs').classList.toggle('hidden', !authed || stack.length > 0);
  $('whoBox').classList.toggle('hidden', !authed);
  if (!authed) { renderLogin(app); return; }
  $('whoName').textContent = S.cred.user;
  updateSyncLabel();
  const top = stack[stack.length - 1];
  if (!top) {
    [].forEach.call($('tabs').querySelectorAll('button'), b => b.classList.toggle('on', b.getAttribute('data-tab') === tab));
    if (tab === 'people') return renderPeople(app);
    if (tab === 'probation') return renderProbation(app);
    if (tab === 'activity') return renderActivity(app);
    return renderMore(app);
  }
  if (top.view === 'profile') return renderProfile(app, top.p);
  if (top.view === 'form') return renderForm(app, top.p);
  if (top.view === 'entry') return renderEntry(app, top.p);
  if (top.view === 'employee') return renderEmployeeEdit(app, top.p);
  if (top.view === 'import') return renderImport(app);
}

/* ================= Login ================= */
function renderLogin(app) {
  setHeader('Profiles', 'Supervisors only', false);
  const last = (S.cred && S.cred.user) || lsGet('profiles_last_user', '');
  app.innerHTML = '<div class="card loginbox"><h2>Sign in</h2>' +
    (S.url ? '' : '<div class="field"><label>Backend URL <span class="hint">the Apps Script web app link ending in /exec</span></label><input type="text" id="lgUrl" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"></div>') +
    '<div class="field"><label>Supervisor</label><select id="lgUser">' + S.users.map(u => '<option' + (u === last ? ' selected' : '') + '>' + esc(u) + '</option>').join('') + '</select></div>' +
    '<div class="field"><label>PIN</label><input type="password" id="lgPin" inputmode="numeric" autocomplete="current-password" maxlength="12"></div>' +
    '<button class="btn" id="lgBtn">Sign in</button><div class="err" id="loginErr"></div>' +
    (S.url ? '<div class="sync"><a href="#" id="lgChangeUrl" style="color:var(--sub)">Change backend URL</a></div>' : '') + '</div>';
  $('lgBtn').onclick = async () => {
    const err = $('loginErr'); err.textContent = '';
    if (!S.url) {
      const u = ($('lgUrl').value || '').trim();
      if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)) { err.textContent = 'That is not an Apps Script /exec link'; return; }
      S.url = u;
    }
    S.cred = { user: $('lgUser').value, pin: $('lgPin').value.trim() };
    if (!S.cred.pin) { S.cred = null; err.textContent = 'Enter your PIN'; return; }
    $('lgBtn').disabled = true;
    try {
      const r = await api('login');
      if (r && r.ok) { lsSet(LS_URL, S.url); lsSet(LS_CRED, S.cred); lsSet('profiles_last_user', S.cred.user); S.users = r.users || S.users; stack = []; tab = 'people'; loadCache(); render(); refresh(true); return; }
      S.cred = null; err.textContent = (r && r.error) || 'Could not sign in';
    } catch (e) { S.cred = null; if (!lsGet(LS_URL, '')) S.url = ''; err.textContent = 'Could not reach the backend. Check the link and your connection.'; }
    $('lgBtn').disabled = false;
  };
  const ch = $('lgChangeUrl');
  if (ch) ch.onclick = ev => { ev.preventDefault(); lsDel(LS_URL); S.url = ''; render(); };
}

/* ================= People ================= */
function renderPeople(app) {
  setHeader('People', S.employees.filter(e => e.status !== 'left').length + ' employees', false);
  const q = normName(filters.q);
  let list = S.employees.filter(e => e.status !== 'left' && (!q || normName(e.name).indexOf(q) >= 0 || normName(e.team).indexOf(q) >= 0 || normName(e.badge).indexOf(q) >= 0));
  list.sort((a, b) => a.name.localeCompare(b.name));
  let h = '<div class="card"><input type="search" id="pplQ" placeholder="Search name, team or badge…" value="' + esc(filters.q) + '" autocomplete="off"><div class="row" style="margin-top:10px"><button class="btn small" id="pplAdd">+ Add employee</button><button class="btn small ghost" id="pplImport">Import list</button></div></div>';
  if (!S.employees.length) h += '<div class="card"><div class="empty">No employees yet. Tap <b>Import list</b> to paste your names once (or load the Informal Counseling list).</div></div>';
  h += '<div id="pplList">' + list.map(e => personItem(e)).join('') + '</div>';
  app.innerHTML = h;
  $('pplQ').oninput = ev => { filters.q = ev.target.value; const pos = ev.target.selectionStart; renderPeople(app); const i = $('pplQ'); i.focus(); try { i.setSelectionRange(pos, pos); } catch (e) {} };
  $('pplAdd').onclick = () => go('employee', {});
  $('pplImport').onclick = () => go('import');
  bindItems(app);
}
function personItem(e) {
  const c = counts(e.id);
  const chips = (c.VERBAL ? '<span class="chip warn">Verbal ' + c.VERBAL + '</span>' : '') + (c.WRITTEN ? '<span class="chip bad">Written ' + c.WRITTEN + '</span>' : '') + probChip(e);
  const last = entriesFor(e.id)[0];
  return '<button class="item" data-go="profile" data-id="' + esc(e.id) + '"><div class="nm">' + esc(e.name) + '</div><div class="sb">' + esc([e.team, e.badge && ('#' + e.badge)].filter(Boolean).join(' · ')) + (last ? ((e.team || e.badge) ? ' · ' : '') + 'last: ' + esc(shortDate(last.date)) : '') + '</div>' + (chips ? '<div style="margin-top:6px">' + chips + '</div>' : '') + '</button>';
}
function bindItems(root) {
  [].forEach.call(root.querySelectorAll('[data-go]'), b => {
    b.onclick = () => { const v = b.getAttribute('data-go'); go(v, v === 'entry' ? { id: b.getAttribute('data-id') } : { id: b.getAttribute('data-id') }); };

function bindStepper(box) {

function readFields(def, box, prev) {

function setupSig() {
  const cv = $('sigCv');

    const ratio = Math.max(window.devicePixelRatio || 1, 1);
    const fit = () => { const data = sigPad && !sigPad.isEmpty() ? sigPad.toData() : null; cv.width = cv.offsetWidth * ratio; cv.height = cv.offsetHeight * ratio; cv.getContext('2d').scale(ratio, ratio); if (sigPad) { sigPad.clear(); if (data) sigPad.fromData(data); } };
    fit();
    sigPad = new SignaturePad(cv, { penColor: '#16233A', backgroundColor: 'rgba(0,0,0,0)', minWidth: 1.2, maxWidth: 2.6 });
    sigPad.addEventListener('beginStroke', () => { $('sigPh').style.display = 'none'; });

  $('refused').onchange = () => { const r = $('refused').checked; $('witBox').classList.toggle('hidden', !r); $('sigArea').style.opacity = r ? '.4' : '1'; };

function sigDataUrl() {
  if (!sigPad || sigPad.isEmpty()) return '';
  const full = sigPad.toDataURL('image/png');
  try {   // shrink so it fits in a sheet cell
    const src = $('sigCv'); const w = 360, h = Math.round(360 * src.height / src.width);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(src, 0, 0, w, h);
    const small = c.toDataURL('image/png');
    return small && small.length < 44000 ? small : '';
  } catch (e) { return full.length < 44000 ? full : ''; }
}

async function submitForm(def, p, emp, editing, getVals, prior) {
  const vals = getVals();
  // required fields
  for (const f of def.fields) {
    if (!visible(f, vals)) continue;
    if (f.req && !String(vals[f.k] == null ? '' : vals[f.k]).trim()) { toast('Please fill in: ' + f.l); return; }
  }
  let sig = '', refused = false, witness = '';
  if (def.sig) {
    refused = $('refused').checked; witness = ($('witness').value || '').trim();
    if (refused) { if (!witness) { toast('Add the name of the witness'); return; } }
    else { sig = sigDataUrl(); if (!sig) { toast('The employee must sign (or tick "declined")'); return; } }
  }
  const data = {};
  def.fields.forEach(f => { if (visible(f, vals) && f.k !== 'date' && f.k !== 'time' && vals[f.k] != null && vals[f.k] !== '') data[f.k] = f.t === 'stepper' ? Number(vals[f.k]) : vals[f.k]; });
  if (def.sig) { data.refused = refused; data.witness = refused ? witness : ''; }
  if (def.warn) data.prior = prior;
  const entry = {
    id: editing ? editing.id : uid(), type: p.type, date: vals.date, time: vals.time || '',
    employeeIds: [emp.id], employeeNames: [emp.name], teams: editing ? editing.teams : (emp.team ? [emp.team] : []),
    category: p.type === 'NOTE' ? (vals.category || '') : '', title: def.label, text: '', data: data
  };
  entry.text = p.type === 'NOTE' ? (vals.text || '') : (vals.concern || vals.description || vals.comments || '');
  if (p.type === 'NOTE') { delete data.text; delete data.category; }
  const q = outbox().filter(o => o.entry.id !== entry.id);
  q.push({ entry: entry, sig: sig });
  lsSet(LS_OUTBOX, q);
  lsDel(draftKey(p));
  S.entries = mergeEntries((S.serverEntries || S.entries.filter(e => !e.pending)).filter(e => e.id !== entry.id));
  $('fmSave').disabled = true;
  await flushOutbox();
  const saved = outbox().length === 0;
  if (saved) await refresh(true);
  updateSyncLabel();
  const ent = S.entries.find(e => e.id === entry.id) || entry;
  if (def.pdf) {
    lastPdf = { entry: ent, sig: sig, refused: refused };
    showPdfSheet(def, ent, saved, true);
  } else { toast(saved ? 'Saved' : 'Saved on this phone — will upload when online', 3000); stack.pop(); render(); }
}

let lastPdf = null;
function pdfFilename(e) {

function buildPdf(e, sig) {

  const need = h => { if (y + h > 275) { footer(); doc.addPage(); y = 20; } };
  const h = 13;
  try { doc.addImage(LOGO_PDF, 'PNG', mL, y - 8, h * LOGO_ASPECT, h); } catch (err) {}
  doc.setFont('helvetica', 'bold'); doc.setFontSize(14); doc.setTextColor(14, 35, 64);

  doc.setDrawColor(221, 228, 236); doc.setLineWidth(0.4); doc.line(mL, y + 10, pageW - mR, y + 10);

    const lw = doc.getTextWidth(label + ' ');
    doc.setFont('helvetica', 'normal'); doc.setTextColor(30, 40, 60);
    const lines = doc.splitTextToSize(String(value || '—'), cw - lw);
    doc.text(lines, mL + lw, y); y += 5.2 * lines.length + 1.8;
  };
  const block = (label, value) => {
    need(14);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5); doc.setTextColor(14, 35, 64); doc.text(label, mL, y); y += 5.5;
    doc.setFont('helvetica', 'normal'); doc.setTextColor(30, 40, 60);
    String(value || '—').split(/\r?\n/).forEach(par => {
      doc.splitTextToSize(par || ' ', cw).forEach(line => { need(6); doc.text(line, mL, y); y += 5.2; });
    });
    y += 5;
  };
  inline('Employee:', e.employeeNames.join(', '));
  inline('Date:', fmtDate(e.date) + (d.time || e.time ? ' at ' + (e.time) : ''));
  inline('Site:', SITE);
  y += 2;
  if (d.prior) { inline('Previously on file:', d.prior.COUNSELING + ' informal counseling, ' + d.prior.VERBAL + ' verbal, ' + d.prior.WRITTEN + ' written'); y += 2; }
  def.fields.forEach(f => {
    if (f.k === 'date' || f.k === 'time' || f.t === 'user' || !visible(f, d)) return;
    const v = d[f.k]; if (v == null || v === '') return;

    else inline(label, displayVal(f, v));

  inline('Line Manager:', LINE_MANAGER);
  y += 4;
  need(48);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5); doc.setTextColor(14, 35, 64);
  doc.text('Employee Acknowledgment:', mL, y); y += 4;
  if (d.refused) {
    doc.setFont('helvetica', 'normal'); doc.setTextColor(30, 40, 60);
    doc.text('The employee declined / was unable to sign.', mL, y + 4);
    doc.text('Witness: ' + (d.witness || ''), mL, y + 10); y += 16;
  } else {
    const sw = 70, sh = 28;

    doc.setDrawColor(180, 190, 205); doc.line(mL, y + sh + 2, mL + sw, y + sh + 2);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(110, 120, 140);
    doc.text(e.employeeNames[0] || '', mL, y + sh + 6);
    const ds = fmtDate(e.date); doc.text(ds, mL + sw - doc.getTextWidth(ds), y + sh + 6);
    y += sh + 12;
  }
  if (def.attest) {
    doc.setFont('helvetica', 'italic'); doc.setFontSize(8.5); doc.setTextColor(110, 120, 140);
    doc.splitTextToSize(def.attest, cw).forEach(line => { need(5); doc.text(line, mL, y); y += 4.3; });
  }
  footer();
  return doc;
}
let lastDoc = null;
let sheetFromForm = false;
function showPdfSheet(def, e, uploaded, fromForm) {
  sheetFromForm = !!fromForm;
  try { lastDoc = buildPdf(e, lastPdf.sig); } catch (err) { lastDoc = null; toast('Saved, but the PDF could not be built: ' + err.message, 4000); }
  $('sheetTitle').textContent = uploaded ? 'Saved' : 'Saved on this phone';
  $('sheetSub').textContent = (uploaded ? '' : 'It will upload when you are online. ') + pdfFilename(e);
  $('overlay').classList.add('show');
}
function closeSheet() { $('overlay').classList.remove('show'); }
$('btnDone').onclick = () => { closeSheet(); if (sheetFromForm) { stack.pop(); render(); window.scrollTo(0, 0); } };
$('btnSavePdf').onclick = () => { if (!lastDoc) return; lastDoc.save(pdfFilename(lastPdf.entry)); toast('PDF saved to this phone'); };
$('btnShare').onclick = async () => {
  if (!lastDoc) return;
  const name = pdfFilename(lastPdf.entry);
  const file = new File([lastDoc.output('blob')], name, { type: 'application/pdf' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: FORMS[lastPdf.entry.type].label, text: FORMS[lastPdf.entry.type].label + ' — ' + lastPdf.entry.employeeNames[0] }); }
    catch (err) { if (err.name !== 'AbortError') toast('Share cancelled'); }
  } else { lastDoc.save(name); toast('Sharing is not available here — PDF downloaded instead'); }
};
$('overlay').addEventListener('click', ev => { if (ev.target.id === 'overlay') closeSheet(); });

/* ================= Boot ================= */
window.addEventListener('online', () => { refresh(true); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.cred) refresh(true); });
loadCache();
render();
if (S.cred && S.url) refresh(true);
</script>
